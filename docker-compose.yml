version: '3.8'

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:14-alpine
    container_name: quantumos-db
    restart: always
    environment:
      POSTGRES_USER: quantumos
      POSTGRES_PASSWORD: quantumos
      POSTGRES_DB: quantumos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - quantumos-network

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantumos-backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_URI=postgresql://quantumos:quantumos@db:5432/quantumos
      - SECRET_KEY=sua-chave-secreta-muito-segura
      - ALLOW_ORIGINS=http://localhost:3000,https://www.aigronovatech.com.br
      - JWT_EXPIRE_MINUTES=60
      - LOG_LEVEL=INFO
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - quantumos-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantumos-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - quantumos-network

  # Nginx para proxy reverso e SSL
  nginx:
    image: nginx:alpine
    container_name: quantumos-nginx
    restart: always
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/www:/var/www/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - quantumos-network

networks:
  quantumos-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data: